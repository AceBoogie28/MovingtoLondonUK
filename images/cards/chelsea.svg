<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="250" fill="#f0eade"/>
  <line x1="0" y1="205" x2="400" y2="205" stroke="#14213d" stroke-width="2" opacity="0.5"/>
  <!-- terrace behind -->
  <g stroke="#14213d" stroke-width="1.75" fill="none" opacity="0.8">
    <rect x="60" y="70" width="60" height="95"/>
    <rect x="280" y="70" width="60" height="95"/>
  </g>
  <g stroke="#14213d" stroke-width="1" opacity="0.4" fill="none">
    <rect x="70" y="82" width="14" height="16"/><rect x="96" y="82" width="14" height="16"/>
    <rect x="70" y="110" width="14" height="16"/><rect x="96" y="110" width="14" height="16"/>
    <rect x="290" y="82" width="14" height="16"/><rect x="316" y="82" width="14" height="16"/>
    <rect x="290" y="110" width="14" height="16"/><rect x="316" y="110" width="14" height="16"/>
  </g>
  <!-- garden square railing -->
  <rect x="130" y="150" width="140" height="55" fill="#14213d" fill-opacity="0.05" stroke="#14213d" stroke-width="2"/>
  <g stroke="#14213d" stroke-width="1.25" opacity="0.55">
    <line x1="140" y1="150" x2="140" y2="140"/><line x1="155" y1="150" x2="155" y2="140"/>
    <line x1="170" y1="150" x2="170" y2="140"/><line x1="185" y1="150" x2="185" y2="140"/>
    <line x1="215" y1="150" x2="215" y2="140"/><line x1="230" y1="150" x2="230" y2="140"/>
    <line x1="245" y1="150" x2="245" y2="140"/><line x1="260" y1="150" x2="260" y2="140"/>
  </g>
  <!-- tree in the square -->
  <circle cx="200" cy="155" r="24" fill="#14213d" fill-opacity="0.08" stroke="#14213d" stroke-width="2"/>
  <line x1="200" y1="179" x2="200" y2="205" stroke="#14213d" stroke-width="2.25"/>
  <!-- bench -->
  <g stroke="#14213d" stroke-width="1.5" stroke-linecap="round">
    <line x1="150" y1="205" x2="150" y2="192"/>
    <line x1="170" y1="205" x2="170" y2="192"/>
    <line x1="148" y1="192" x2="172" y2="192"/>
  </g>
  <circle cx="220" cy="135" r="5.5" fill="#c08a2e"/>
</svg>
