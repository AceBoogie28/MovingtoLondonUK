<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="250" fill="#ffffff"/>
  <line x1="0" y1="205" x2="400" y2="205" stroke="#14213d" stroke-width="2" opacity="0.5"/>
  <!-- museum facade with columns and pediment -->
  <polygon points="130,90 270,90 300,130 100,130" fill="#14213d" fill-opacity="0.06" stroke="#14213d" stroke-width="2.25"/>
  <rect x="100" y="130" width="200" height="75" fill="none" stroke="#14213d" stroke-width="2.25"/>
  <g stroke="#14213d" stroke-width="2">
    <line x1="120" y1="130" x2="120" y2="205"/>
    <line x1="150" y1="130" x2="150" y2="205"/>
    <line x1="180" y1="130" x2="180" y2="205"/>
    <line x1="220" y1="130" x2="220" y2="205"/>
    <line x1="250" y1="130" x2="250" y2="205"/>
    <line x1="280" y1="130" x2="280" y2="205"/>
  </g>
  <g stroke="#14213d" stroke-width="1" opacity="0.4">
    <line x1="130" y1="140" x2="130" y2="205"/>
    <line x1="160" y1="140" x2="160" y2="205"/>
    <line x1="190" y1="140" x2="190" y2="205"/>
    <line x1="240" y1="140" x2="240" y2="205"/>
    <line x1="270" y1="140" x2="270" y2="205"/>
  </g>
  <!-- steps -->
  <line x1="90" y1="205" x2="310" y2="205" stroke="#14213d" stroke-width="2"/>
  <line x1="95" y1="213" x2="305" y2="213" stroke="#14213d" stroke-width="1.5" opacity="0.6"/>
  <!-- flag / accent -->
  <line x1="200" y1="90" x2="200" y2="60" stroke="#14213d" stroke-width="1.75"/>
  <path d="M200 60 L222 68 L200 76 Z" fill="#c08a2e"/>
</svg>
