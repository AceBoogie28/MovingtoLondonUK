<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="250" fill="#ffffff"/>
  <line x1="0" y1="205" x2="400" y2="205" stroke="#14213d" stroke-width="2" opacity="0.5"/>
  <!-- warehouse building -->
  <rect x="90" y="75" width="220" height="130" fill="#14213d" fill-opacity="0.04" stroke="#14213d" stroke-width="2.25"/>
  <!-- large factory windows grid -->
  <g stroke="#14213d" stroke-width="1.5" opacity="0.6">
    <rect x="105" y="90" width="45" height="55" fill="none"/>
    <rect x="160" y="90" width="45" height="55" fill="none"/>
    <rect x="215" y="90" width="45" height="55" fill="none"/>
    <rect x="270" y="90" width="25" height="55" fill="none"/>
    <line x1="127" y1="90" x2="127" y2="145"/><line x1="105" y1="117" x2="150" y2="117"/>
    <line x1="182" y1="90" x2="182" y2="145"/><line x1="160" y1="117" x2="205" y2="117"/>
    <line x1="237" y1="90" x2="237" y2="145"/><line x1="215" y1="117" x2="260" y2="117"/>
  </g>
  <g stroke="#14213d" stroke-width="1" opacity="0.4">
    <rect x="105" y="155" width="20" height="30" fill="none"/>
    <rect x="135" y="155" width="20" height="30" fill="none"/>
    <rect x="165" y="155" width="20" height="30" fill="none"/>
    <rect x="235" y="155" width="20" height="30" fill="none"/>
    <rect x="265" y="155" width="20" height="30" fill="none"/>
  </g>
  <!-- loading door, gold -->
  <rect x="190" y="155" width="30" height="50" fill="#c08a2e" fill-opacity="0.85"/>
  <g stroke="#f0eade" stroke-width="1.25" opacity="0.7">
    <line x1="190" y1="170" x2="220" y2="170"/>
    <line x1="190" y1="185" x2="220" y2="185"/>
  </g>
  <!-- pipe / exterior duct detail -->
  <path d="M320 90 L320 205" stroke="#14213d" stroke-width="1.5" opacity="0.4" fill="none"/>
  <circle cx="320" cy="90" r="4" fill="none" stroke="#14213d" stroke-width="1.25"/>
</svg>
