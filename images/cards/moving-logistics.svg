<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="250" fill="#f0eade"/>
  <line x1="0" y1="200" x2="400" y2="200" stroke="#14213d" stroke-width="2" opacity="0.5"/>
  <!-- shipping container -->
  <rect x="100" y="115" width="200" height="85" fill="#14213d" fill-opacity="0.05" stroke="#14213d" stroke-width="2.25"/>
  <g stroke="#14213d" stroke-width="1" opacity="0.4">
    <line x1="120" y1="115" x2="120" y2="200"/><line x1="140" y1="115" x2="140" y2="200"/>
    <line x1="160" y1="115" x2="160" y2="200"/><line x1="180" y1="115" x2="180" y2="200"/>
    <line x1="220" y1="115" x2="220" y2="200"/><line x1="240" y1="115" x2="240" y2="200"/>
    <line x1="260" y1="115" x2="260" y2="200"/><line x1="280" y1="115" x2="280" y2="200"/>
  </g>
  <rect x="192" y="115" width="20" height="85" fill="#c08a2e" fill-opacity="0.9"/>
  <line x1="202" y1="115" x2="202" y2="200" stroke="#f0eade" stroke-width="1"/>
  <!-- wheels -->
  <circle cx="140" cy="205" r="9" fill="none" stroke="#14213d" stroke-width="2.25"/>
  <circle cx="260" cy="205" r="9" fill="none" stroke="#14213d" stroke-width="2.25"/>
  <!-- luggage tag / label detail -->
  <rect x="310" y="150" width="22" height="16" fill="none" stroke="#14213d" stroke-width="1.5"/>
  <line x1="310" y1="158" x2="332" y2="158" stroke="#14213d" stroke-width="1"/>
  <line x1="300" y1="150" x2="310" y2="158" stroke="#14213d" stroke-width="1.25"/>
</svg>
